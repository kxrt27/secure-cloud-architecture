<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
        }

        header {
            background-color: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        .login-button {
            background-color: #1f4e79;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #163a5c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #1f4e79;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>Secure Cloud-Based Student Information</p>
    </header>

    <div class="container">

        <button class="login-button">Login</button>

        <h2>Student Records</h2>

        <table>
            <tr>
                <th>Student No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>Year Level</th>
                <th>Email</th>
            </tr>

            <tr>
                <td>2026-001</td>
                <td>Juan Dela Cruz</td>
                <td>BSIT</td>
                <td>2nd Year</td>
                <td>juan@example.com</td>
            </tr>

            <tr>
                <td>2026-002</td>
                <td>Maria Santos</td>
                <td>BSCS</td>
                <td>2nd Year</td>
                <td>maria@example.com</td>
            </tr>

            <tr>
                <td>2026-003</td>
                <td>Pedro Reyes</td>
                <td>BSIT</td>
                <td>1st Year</td>
                <td>pedro@example.com</td>
            </tr>
        </table>

    </div>

</body>
</html>
